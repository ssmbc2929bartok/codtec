<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="エンジニア向けのターミナル風タイピングゲーム。24 言語・2900 問以上のコードで練習できます。">
    <title>Codtec | Programming Typing</title>
    <!-- X などにリンクを貼ったときのカード。画像は絶対 URL で書く（相対パスは読まれない） -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Codtec">
    <meta property="og:title" content="Codtec | Programming Typing">
    <meta property="og:description" content="エンジニア向けのターミナル風タイピングゲーム。24 言語・2900 問以上のコードで練習できます。">
    <meta property="og:url" content="https://ssmbc2929bartok.github.io/codtec/">
    <meta property="og:image" content="https://ssmbc2929bartok.github.io/codtec/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="紺色の背景に、青い文字で「&gt; CODTEC_」と書かれた Codtec のロゴ">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Codtec | Programming Typing">
    <meta name="twitter:description" content="エンジニア向けのターミナル風タイピングゲーム。24 言語・2900 問以上のコードで練習できます。">
    <meta name="twitter:image" content="https://ssmbc2929bartok.github.io/codtec/ogp.png">
    <meta name="twitter:image:alt" content="紺色の背景に、青い文字で「&gt; CODTEC_」と書かれた Codtec のロゴ">
    <!-- ?v= は古いキャッシュを避けるための印。node tools/release.mjs <番号> で、data/registry.js の VERSION と一緒に書き換える -->
    <link rel="stylesheet" href="codtec.css?v=2.4.2">
</head>
<body>

    <div id="game-container">
        <section id="menu-screen">
            <a class="btn-ghost portal-link" href="https://ssmbar.com/">&larr; ポータルに戻る</a>
            <a class="btn-ghost howto-link" href="howto.html">HOW TO PLAY</a>
            <h1>&gt; CODTEC_</h1>
            <p id="menu-message" class="menu-message" role="status"></p>

            <div class="selection-group">
                <p class="label">01. SELECT LANGUAGE <span id="lang-count"></span></p>
                <div id="lang-selector"></div>
                <p id="lang-note" class="desc"></p>
            </div>
            <div class="selection-group">
                <p class="label">02. SELECT COURSE</p>
                <div id="course-selector" class="chip-row"></div>
                <p id="course-desc" class="desc"></p>
            </div>
            <div class="selection-group">
                <p class="label">03. SELECT MODE</p>
                <div id="mode-selector" class="chip-row"></div>
                <p id="mode-desc" class="desc"></p>
                <div id="custom-panel" class="custom-panel" hidden>
                    <label>問題数 <input id="custom-words" type="number" min="0" max="999" inputmode="numeric"></label>
                    <label>持ち時間（秒） <input id="custom-seconds" type="number" min="0" max="3600" inputmode="numeric"></label>
                    <label>1 問ごとの追加（秒） <input id="custom-bonus" type="number" min="0" max="60" inputmode="numeric"></label>
                    <label>1 ミスごとの減少（秒） <input id="custom-penalty" type="number" min="0" max="10" step="0.1" inputmode="decimal"></label>
                    <label>ミスの上限（回） <input id="custom-lives" type="number" min="0" max="99" inputmode="numeric"></label>
                    <p class="custom-help">0 にした項目は「なし」になります。どれかの条件を満たした時点で終了します。</p>
                    <p id="custom-summary" class="custom-summary"></p>
                </div>
            </div>

            <p id="best-display" class="best-display"></p>
            <button id="start-btn" class="btn-gradient" type="button" disabled>
                <span>[ MISSION START ]</span>
            </button>
            <p class="key-hint">
                <kbd>&larr;</kbd><kbd>&rarr;</kbd> 言語　<kbd>&uarr;</kbd><kbd>&darr;</kbd> コース　<kbd>1</kbd>-<kbd>7</kbd> モード　<kbd>Enter</kbd> 開始
            </p>
        </section>

        <section id="game-screen" hidden>
            <div class="game-header">
                <div id="game-info">SYSTEM STATUS: RUNNING</div>
                <button id="pause-btn" class="btn-ghost" type="button">
                    <span class="pause-icon" aria-hidden="true"></span>PAUSE <kbd>Esc</kbd>
                </button>
            </div>
            <div id="toast" class="toast" role="status"></div>
            <div id="course-tag" class="course-tag"></div>
            <div id="word-display"></div>
            <div id="note-display"></div>
            <div id="timer-display">TIME: 0.00s</div>

            <div id="pause-overlay" hidden>
                <div class="pause-title">|| PAUSED</div>
                <p class="pause-sub">タイマーは止まっています</p>
                <div class="pause-actions">
                    <button class="btn-ghost" type="button" data-action="resume">再開する <kbd>Esc</kbd></button>
                    <button class="btn-ghost" type="button" data-action="restart">最初からやり直す <kbd>R</kbd></button>
                    <button class="btn-ghost" type="button" data-action="quit">メニューへ戻る <kbd>Q</kbd></button>
                </div>
            </div>
        </section>

        <section id="result-screen" hidden></section>

        <footer id="app-footer">
            <button id="bg-btn" class="bg-btn" type="button" title="背景を切り替える">BG: PLAIN</button>
            <span id="version-label"></span>
            <a href="https://github.com/ssmbc2929bartok/codtec/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">変更履歴</a>
            <a href="https://github.com/ssmbc2929bartok/codtec" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
    </div>

    <script src="theme.js?v=2.4.2"></script>
    <script src="data/registry.js?v=2.4.2"></script>
    <script src="data/manifest.js?v=2.4.2"></script>
    <script src="script.js?v=2.4.2"></script>
</body>
</html>
